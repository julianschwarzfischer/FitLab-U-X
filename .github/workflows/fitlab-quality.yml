name: FITNESS LAB browser quality gate
on:
  workflow_dispatch:
  push:
    branches: ['test/evolution-ci-meilenstein', 'dev/evolution-3-exercise-atlas', 'dev/evolution-3-premium-ux']
jobs:
  browser-e2e:
    if: github.ref == 'refs/heads/test/evolution-ci-meilenstein' || github.ref == 'refs/heads/dev/evolution-3-exercise-atlas' || github.ref == 'refs/heads/dev/evolution-3-premium-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run test:static
      - name: Playwright browser checks
        run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitlab-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
